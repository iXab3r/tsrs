name: Windows conformance reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: build x86_64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TSRS_TS_VERSION: 7.1.0-beta
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Check out TypeScript testdata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: 3e9236361fa97a9e6c685f4833ac457ae2d8c50a
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc/testdata
          persist-credentials: false

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        with:
          registry-url: ""

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          restore-cache: false

      - run: rustup target add x86_64-pc-windows-msvc

      - name: Build conformance runner
        shell: pwsh
        run: |
          cargo build --profile ci --locked -p tsrs_cli -p tsrs_testrunner --bins --features tsrs_cli/noembed --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conformance baselines
        shell: pwsh
        run: |
          $env:TSRS_LIB_PATH = Join-Path $env:GITHUB_WORKSPACE "crates/tsrs_vfs/libs"
          $env:TSRS_TEST_RESULTS = Join-Path $env:RUNNER_TEMP "pgo/test-results"
          & ./target/x86_64-pc-windows-msvc/ci/tsrs-test.exe run --suite all --baselines all --jobs 2 --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows conformance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-conformance-results
          path: ${{ runner.temp }}/pgo/test-results/
          if-no-files-found: ignore

